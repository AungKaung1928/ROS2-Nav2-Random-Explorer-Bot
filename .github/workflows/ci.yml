name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/random_explorer_bot
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select random_explorer_bot --event-handlers console_direct+
      - name: Package installed
        run: |
          source install/setup.bash
          ros2 pkg prefix random_explorer_bot
      - name: Launch test (node with a known map, static tf and a stand-in Nav2 server)
        run: |
          source install/setup.bash
          cd src/random_explorer_bot
          GOALS_CSV=$GITHUB_WORKSPACE/goals.csv launch_test test/test_launch_goals.py
          python3 scripts/plot_goals.py $GITHUB_WORKSPACE/goals.csv $GITHUB_WORKSPACE/goals.svg
      - name: Upload the goals
        uses: actions/upload-artifact@v4
        with:
          name: goals
          path: |
            goals.csv
            goals.svg
